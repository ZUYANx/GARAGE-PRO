{% extends "base.html" %}
{% block title %}{{ t('sign_in') }}{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
    <div class="card" style="max-width:400px; width:100%;">
        <h2 style="text-align:center; margin-bottom:1.5rem; color:var(--primary);">{{ t('sign_in') }}</h2>
        <form method="POST">
            <div class="form-group"><label class="form-label">{{ t('username') }}</label><input type="text" name="username" class="form-input" required autofocus></div>
            <div class="form-group"><label class="form-label">{{ t('password') }}</label><input type="password" name="password" class="form-input" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">{{ t('sign_in') }}</button>
        </form>
        <p style="text-align:center; margin-top:1rem; font-size:0.8rem; color:var(--text-muted);">{{ t('default_credentials') }}</p>
    </div>
</div>
{% endblock %}
