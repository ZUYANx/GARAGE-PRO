{% extends "base.html" %}
{% block title %}{{ t('sign_in') }}{% endblock %}
{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #059669 0%, #047857 50%, #065f46 100%);
        position: relative;
        overflow: hidden;
    }
    
    /* Background pattern */
    .login-wrapper::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 30px 30px;
        animation: patternMove 20s linear infinite;
    }
    
    @keyframes patternMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, 30px); }
    }
    
    .login-container {
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
    }
    
    .login-card {
        background: var(--surface);
        border-radius: 20px;
        padding: 48px 40px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 36px;
    }
    
    .login-logo {
        width: 72px;
        height: 72px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3);
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3); }
        50% { box-shadow: 0 8px 32px rgba(5, 150, 105, 0.5); }
    }
    
    .login-logo svg {
        width: 36px;
        height: 36px;
        fill: white;
    }
    
    .login-title {
        font-size: 26px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
    }
    
    .login-subtitle {
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 400;
    }
    
    .input-group {
        position: relative;
        margin-bottom: 20px;
    }
    
    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
        z-index: 1;
        transition: color 0.3s;
    }
    
    .input-icon svg {
        width: 20px;
        height: 20px;
    }
    
    .input-group input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 15px;
        background: var(--bg);
        transition: all 0.3s;
        font-family: 'Inter', sans-serif;
        color: var(--text);
    }
    
    .input-group input:focus {
        outline: none;
        border-color: #059669;
        box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        background: var(--surface);
    }
    
    .input-group input:focus + .input-icon,
    .input-group input:focus ~ .input-icon {
        color: #059669;
    }
    
    .input-group input::placeholder {
        color: var(--text-muted);
    }
    
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 8px;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.3px;
        position: relative;
        overflow: hidden;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4);
    }
    
    .login-btn:active {
        transform: translateY(0);
    }
    
    .login-btn::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    
    .login-btn:active::after {
        width: 300px;
        height: 300px;
    }
    
    .login-footer {
        text-align: center;
        margin-top: 28px;
    }
    
    .login-footer p {
        color: var(--text-muted);
        font-size: 13px;
    }
    
    .login-footer a {
        color: #059669;
        text-decoration: none;
        font-weight: 600;
    }
    
    .login-footer a:hover {
        text-decoration: underline;
    }
    
    /* Error state */
    .input-group.error input {
        border-color: #dc2626;
    }
    
    .input-group.error .input-icon {
        color: #dc2626;
    }
    
    /* Success state */
    .input-group.success input {
        border-color: #059669;
    }
    
    .input-group.success .input-icon {
        color: #059669;
    }
    
    @media (max-width: 480px) {
        .login-card {
            padding: 32px 24px;
        }
        
        .login-title {
            font-size: 22px;
        }
        
        .login-logo {
            width: 60px;
            height: 60px;
        }
        
        .login-logo svg {
            width: 30px;
            height: 30px;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z"/>
                    </svg>
                </div>
                <h1 class="login-title">GaragePro</h1>
                <p class="login-subtitle">{{ t('sign_in') }} to continue to your dashboard</p>
            </div>

            <form method="POST" autocomplete="off">
                <div class="input-group" id="usernameGroup">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" name="username" placeholder="{{ t('username') }}" required autofocus>
                </div>

                <div class="input-group" id="passwordGroup">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="{{ t('password') }}" required>
                </div>

                <button type="submit" class="login-btn">
                    {{ t('sign_in') }}
                </button>
            </form>

            <div class="login-footer">
                <p>GaragePro Management System</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Add subtle animation on input focus
    document.querySelectorAll('.input-group input').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
        });
        input.addEventListener('blur', function() {
            this.parentElement.classList.remove('focused');
            if (this.value) {
                this.parentElement.classList.add('has-value');
            } else {
                this.parentElement.classList.remove('has-value');
            }
        });
    });
    
    // Add ripple effect on button click
    document.querySelector('.login-btn').addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        this.appendChild(ripple);
        const x = e.clientX - e.target.offsetLeft;
        const y = e.clientY - e.target.offsetTop;
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        setTimeout(() => {
            ripple.remove();
        }, 600);
    });
</script>
{% endblock %}
