{% extends "base.html" %}
{% block title %}{{ t('sign_in') }}{% endblock %}
{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    }
    .login-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 40px;
        box-shadow: var(--shadow-lg);
        max-width: 400px;
        width: 100%;
        animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .login-logo {
        width: 64px; height: 64px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        border-radius: var(--radius-md);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 6px 20px rgba(5,150,105,0.3);
    }
    .login-logo svg { width: 32px; height: 32px; fill: white; }
    .login-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .login-subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .input-group { position: relative; margin-bottom: 18px; }
    .input-group svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-muted); }
    .input-group input {
        width: 100%; padding: 12px 16px 12px 44px;
        border: 1.5px solid var(--border); border-radius: var(--radius-sm);
        font-size: 14px; background: var(--bg); transition: 0.2s;
        font-family: inherit;
    }
    .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
    .login-btn {
        width: 100%; padding: 12px;
        background: var(--primary); color: white; border: none;
        border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
        cursor: pointer; transition: 0.2s; margin-top: 8px;
        font-family: inherit;
    }
    .login-btn:hover { background: var(--primary-dark); box-shadow: var(--shadow-md); }
    @media (max-width: 480px) { .login-card { padding: 28px 20px; } }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <svg viewBox="0 0 24 24"><path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z"/></svg>
        </div>
        <h1 class="login-title">GaragePro</h1>
        <p class="login-subtitle">{{ t('sign_in') }} to continue</p>
        <form method="POST">
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" name="username" placeholder="{{ t('username') }}" required autofocus>
            </div>
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" name="password" placeholder="{{ t('password') }}" required>
            </div>
            <button type="submit" class="login-btn">{{ t('sign_in') }}</button>
        </form>
    </div>
</div>
{% endblock %}
